
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Interactive JavaScript To-Do List Application">

    <title>To-Do List App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <h1>My To-Do List</h1>
            <p>Manage your daily tasks easily</p>
        </header>


        <!-- Add Task Section -->
        <section class="task-input-section">

            <form id="task-form">

                <input
                    type="text"
                    id="task-input"
                    placeholder="Enter a new task..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="add-task-btn">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Filter Buttons -->
        <section class="filter-section">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="active"
            >
                Active
            </button>

            <button
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </section>


        <!-- Task Information -->
        <section class="task-info">

            <span id="task-count">
                0 tasks
            </span>

            <button id="clear-completed">
                Clear Completed
            </button>

        </section>


        <!-- Task List -->
        <main>

            <ul id="task-list">
                <!-- Tasks will be dynamically added here -->
            </ul>

            <!-- Empty Message -->
            <div id="empty-message" class="empty-message">
                <p>No tasks found.</p>
            </div>

        </main>


        <!-- Footer -->
        <footer>
            <p>To-Do List App &copy; 2026</p>
        </footer>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
